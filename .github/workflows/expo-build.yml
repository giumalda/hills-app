name: Compila iOS e Android
on:
  # Non parte a ogni push: avvialo a mano da Actions → "Compila iOS e Android" → Run workflow
  workflow_dispatch:
    inputs:
      platform:
        description: "Cosa compilare"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - android

jobs:
  build-ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        run: npm install

      - name: Genera la cartella iOS nativa
        run: npx expo prebuild --platform ios

      - name: Compila il codice rilevando lo schema esatto
        run: |
          WORKSPACE=$(ls ios | grep .xcworkspace)
          SCHEME=$(xcodebuild -workspace ios/$WORKSPACE -list | grep "Schemes:" -A 1 | tail -n 1 | xargs)
          
          echo "Workspace trovato: $WORKSPACE"
          echo "Scheme rilevato: $SCHEME"
          
          xcodebuild -workspace ios/$WORKSPACE \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     -derivedDataPath build_output

      - name: Pacchettizza l'app nel file .ipa reale (Trucco del Payload)
        run: |
          mkdir Payload
          find build_output -name "*.app" -exec cp -r {} Payload/ \;
          zip -r hillsburger.ipa Payload

      - name: Rendi l'IPA scaricabile su GitHub
        uses: actions/upload-artifact@v4
        with:
          name: HillsBurger-Vero-IPA
          path: hillsburger.ipa

  build-android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Java per Android
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installa le dipendenze
        run: npm install

      - name: Genera la cartella Android nativa
        run: npx expo prebuild --platform android

      - name: Compila l'APK di Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rendi l'APK scaricabile su GitHub
        uses: actions/upload-artifact@v4
        with:
          name: HillsBurger-Android-APK
          path: android/app/build
