name: Compila Vero IPA Senza Apple ID
on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        run: npm install

      - name: Genera la cartella iOS nativa
        run: npx expo prebuild --platform ios

      - name: Compila il codice rilevando lo schema esatto
        run: |
          # Trova il nome del file .xcworkspace dentro la cartella ios
          WORKSPACE=$(ls ios | grep .xcworkspace)
          # Estrae automaticamente il nome dello schema corretto generato da Expo
          SCHEME=$(xcodebuild -workspace ios/$WORKSPACE -list | grep "Schemes:" -A 1 | tail -n 1 | xargs)
          
          echo "Workspace trovato: $WORKSPACE"
          echo "Scheme rilevato: $SCHEME"
          
          xcodebuild -workspace ios/$WORKSPACE \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CONFIGURATION_BUILD_DIR=../build

      - name: Pacchettizza l'app nel file .ipa reale
        run: |
          mkdir Payload
          cp -r ios/build/hillsburger.app Payload/ || cp -r ios/build/*.app Payload/
          zip -r hillsburger.ipa Payload

      - name: Rendi l'IPA scaricabile su GitHub
        uses: actions/upload-artifact@v4
        with:
          name: HillsBurger-Vero-IPA
          path: hillsburger.ipa
