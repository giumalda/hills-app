name: Build Hill's Burger
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Piattaforme da compilare"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - android

permissions:
  contents: read

jobs:
  build-ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Genera la cartella iOS nativa
        run: npx expo prebuild --platform ios

      - name: Compila l'app iOS
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Non è stato trovato il workspace iOS generato da Expo."
            exit 1
          fi
          PROJECT_PATH="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::Non è stato trovato il progetto Xcode dell'app."
            exit 1
          fi
          SCHEME="$(basename "$PROJECT_PATH" .xcodeproj)"
          xcodebuild -workspace "$WORKSPACE" -list -json | EXPECTED_SCHEME="$SCHEME" node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const schemes = data.workspace?.schemes ?? data.project?.schemes ?? [];
              const expected = process.env.EXPECTED_SCHEME;
              if (!schemes.includes(expected)) {
                console.error(`Schema app "${expected}" non trovato. Schemi disponibili: ${schemes.join(", ")}`);
                process.exit(1);
              }
              console.log(expected);
            });
          '
          if [ -z "$SCHEME" ]; then
            echo "::error::Non è stato possibile selezionare lo schema Xcode dell'app."
            exit 1
          fi

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     -derivedDataPath build_output \
                     build

      - name: Crea il pacchetto IPA non firmato
        run: |
          PRODUCT_DIR="build_output/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Lo schema app iOS non ha prodotto un file .app in $PRODUCT_DIR."
            find build_output/Build/Products -maxdepth 3 -type d -print || true
            exit 1
          fi
          if [ ! -s "$APP_PATH/Info.plist" ] || [ ! -s "$APP_PATH/main.jsbundle" ]; then
            echo "::error::L'app iOS generata è incompleta: mancano Info.plist o main.jsbundle."
            exit 1
          fi
          EXPECTED_BUNDLE_ID="$(node -p "require('./app.json').expo.ios.bundleIdentifier")"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          if [ "$ACTUAL_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Bundle ID IPA inatteso: $ACTUAL_BUNDLE_ID (atteso $EXPECTED_BUNDLE_ID)."
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -qry ../Hills-Burger-unsigned.ipa Payload
          IPA_PATH="../Hills-Burger-unsigned.ipa"
          IPA_APP_PATH="Payload/$(basename "$APP_PATH")"
          unzip -tq "$IPA_PATH"
          unzip -p "$IPA_PATH" "$IPA_APP_PATH/Info.plist" > "$RUNNER_TEMP/ipa-Info.plist"
          IPA_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/ipa-Info.plist")"
          if [ "$IPA_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Il Bundle ID nell'IPA non corrisponde: $IPA_BUNDLE_ID (atteso $EXPECTED_BUNDLE_ID)."
            exit 1
          fi
          unzip -p "$IPA_PATH" "$IPA_APP_PATH/main.jsbundle" > "$RUNNER_TEMP/ipa-main.jsbundle"
          if [ ! -s "$RUNNER_TEMP/ipa-main.jsbundle" ]; then
            echo "::error::Il bundle JavaScript nell'IPA è assente o vuoto."
            exit 1
          fi
          echo "## IPA iOS non firmato" >> "$GITHUB_STEP_SUMMARY"
          echo "Il file IPA è validato ma non firmato; trascinalo in Sideloadly e firmalo con il tuo Apple ID prima dell'installazione. Per distribuirlo senza sideloading servono certificato Apple Developer e provisioning profile." >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica l'IPA scaricabile direttamente
        uses: actions/upload-artifact@v7
        with:
          path: Hills-Burger-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

  build-android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Genera la cartella Android nativa
        run: npx expo prebuild --platform android --no-install

      - name: Installa Java per Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura cache Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compila l'APK di Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --build-cache --parallel --no-daemon --console=plain assembleRelease
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Gradle non ha prodotto l'APK release atteso: $APK_PATH"
            exit 1
          fi
          if ! unzip -Z1 "$APK_PATH" | grep -qx 'assets/index.android.bundle'; then
            echo "::error::L'APK non contiene il bundle JavaScript Android."
            exit 1
          fi
          cp "$APK_PATH" ../Hills-Burger.apk

      - name: Pubblica l'APK scaricabile direttamente
        uses: actions/upload-artifact@v7
        with:
          path: Hills-Burger.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
