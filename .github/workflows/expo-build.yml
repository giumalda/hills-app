name: Compila Vero IPA Senza Apple ID
on:
  push:
    branches: [ main ] # Si attiva quando carichi i file su GitHub nel ramo main

jobs:
  build-ios:
    runs-on: macos-latest # GitHub accende un Mac virtuale aggiornato
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa le dipendenze
        run: npm install

      - name: Genera la cartella iOS nativa
        run: npx expo prebuild --platform ios

      - name: Compila il codice in un'app Nativa (.app)
        run: |
          xcodebuild -workspace ios/hillsburger.xcworkspace \
                     -scheme hillsburger \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Pacchettizza l'app nel file .ipa reale (Trucco del Payload)
        run: |
          mkdir Payload
          cp -r ios/build/Build/Products/Release-iphoneos/hillsburger.app Payload/
          zip -r hillsburger.ipa Payload

      - name: Rendi l'IPA scaricabile su GitHub
        uses: actions/upload-artifact@v4
        with:
          name: HillsBurger-Vero-IPA
          path: hillsburger.ipa
