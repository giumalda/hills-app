name: Build Hill's Burger
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Piattaforme da compilare"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ios
          - android

permissions:
  contents: read

jobs:
  build-ios:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Genera la cartella iOS nativa
        run: npx expo prebuild --platform ios

      - name: Compila l'app iOS
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Non è stato trovato il workspace iOS generato da Expo."
            exit 1
          fi
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const schemes = data.workspace?.schemes ?? data.project?.schemes ?? [];
              if (!schemes.length) process.exit(1);
              console.log(schemes[0]);
            });
          ')"
          if [ -z "$SCHEME" ]; then
            echo "::error::Non è stato trovato uno schema Xcode."
            exit 1
          fi

          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     -derivedDataPath build_output \
                     build

      - name: Crea il pacchetto IPA non firmato
        run: |
          APP_PATH="$(find build_output/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::La build iOS non ha prodotto un'app .app."
            exit 1
          fi
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -qry ../Hills-Burger-unsigned.ipa Payload
          unzip -t ../Hills-Burger-unsigned.ipa
          unzip -Z1 ../Hills-Burger-unsigned.ipa | grep -Eq '^Payload/[^/]+\.app/Info\.plist$'
          echo "## IPA iOS non firmato" >> "$GITHUB_STEP_SUMMARY"
          echo "Il file IPA è validato ma non firmato; trascinalo in Sideloadly e firmalo con il tuo Apple ID prima dell'installazione. Per distribuirlo senza sideloading servono certificato Apple Developer e provisioning profile." >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica l'IPA scaricabile direttamente
        uses: actions/upload-artifact@v7
        with:
          path: Hills-Burger-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

  build-android:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Genera la cartella Android nativa
        run: npx expo prebuild --platform android --no-install

      - name: Installa Java per Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura cache Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compila l'APK di Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --build-cache --parallel --no-daemon --console=plain assembleRelease
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Gradle non ha prodotto l'APK release atteso: $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" ../Hills-Burger.apk

      - name: Pubblica l'APK scaricabile direttamente
        uses: actions/upload-artifact@v7
        with:
          path: Hills-Burger.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
